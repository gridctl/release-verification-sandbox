name: Sandbox environment check

on:
  workflow_dispatch:

permissions: {}

jobs:
  environment:
    if: github.repository == 'gridctl/release-verification-sandbox'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check runner and OIDC availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          uname -s
          git --version
          gh --version
          curl --version
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew --version
          fi
          printf '%s\n' 'Runner tools and job-scoped OIDC environment are available.'
