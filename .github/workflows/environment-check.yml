name: Sandbox environment check

on:
  workflow_dispatch:

permissions: {}

jobs:
  environment:
    if: github.repository == 'gridctl/release-verification-sandbox'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check runner and OIDC availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          uname -s
          git --version
          gh --version
          curl --version
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew --version
          fi
          printf '%s\n' 'Runner tools and job-scoped OIDC environment are available.'
  tap-access:
    if: github.repository == 'gridctl/release-verification-sandbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify sandbox tap Contents write access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          # An unreferenced test blob verifies write permission without changing a branch.
          gh api --method POST repos/gridctl/homebrew-verification-sandbox/git/blobs \
            -f encoding=utf-8 -f content='Sandbox credential preflight' --jq .sha
